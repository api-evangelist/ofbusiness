name: Ofbusiness
description: 'OfBusiness is one of India''s largest B2B raw-materials procurement and
  credit platforms, serving more than two million SMEs and corporates. It operates as
  an aggregator, manufacturer, and importer/exporter across supply chains including
  steel, aluminium, chemicals, polymers, and agriculture, pairing live commodity pricing,
  quotations, and order tracking with working-capital credit through its NBFC arm Oxyzo.
  Related brands include BidAssist (government tender and procurement intelligence),
  SMEAssist, and Ved AI. The company is backed by Norwest Venture Partners and the
  SoftBank Vision Fund. OfBusiness reaches customers primarily through its website and
  iOS/Android mobile apps; no public developer API or API documentation was found during
  enrichment.'
